<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 184 150" width="184" height="150" role="img" aria-label="Motivation, why I started this">
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8A33D"/><stop offset="34%" stop-color="#D9713C"/>
      <stop offset="67%" stop-color="#8F5FBF"/><stop offset="100%" stop-color="#1F6FEB"/>
    </linearGradient>
    <radialGradient id="die" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F2C57C"/><stop offset="45%" stop-color="#D9713C"/><stop offset="100%" stop-color="#5B2E5E"/>
    </radialGradient>
    <filter id="g" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-100%" y="-100%" width="300%" height="300%">
