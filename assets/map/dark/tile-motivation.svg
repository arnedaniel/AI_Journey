  <rect width="184" height="150" fill="#0D1117"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="10" y="38" width="134" height="76" rx="12" fill="#111A26" stroke="#D9713C" stroke-width="1.5"/>
    <circle cx="27" cy="56" r="3.2" fill="#D9713C" filter="url(#g)"/>
    <text x="77.0" y="72" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#F0F3F8">MOTIVATION</text>
    <text x="77.0" y="93" text-anchor="middle" font-size="9.5" letter-spacing="0.6" fill="#F0A07A">why I started this</text>
