<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 184 250" width="184" height="250" role="img" aria-label="AWS AI Practitioner, in progress">
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BF8700"/><stop offset="34%" stop-color="#BC4C00"/>
      <stop offset="67%" stop-color="#8250DF"/><stop offset="100%" stop-color="#0969DA"/>
    </linearGradient>
    <radialGradient id="die" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F2C57C"/><stop offset="45%" stop-color="#D9713C"/><stop offset="100%" stop-color="#5B2E5E"/>
    </radialGradient>
    <filter id="g" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="184" height="250" fill="#FFFFFF"/>
  <path id="s" d="M0,138 H40" fill="none" stroke="#BF8700" stroke-width="2" opacity="0.6"/>
  <circle r="3" fill="#8A6500" filter="url(#g)"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0.0s"><mpath href="#s" xlink:href="#s"/></animateMotion></circle>
  <circle r="3" fill="#8A6500" filter="url(#g)" opacity="0"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0.75s"><mpath href="#s" xlink:href="#s"/></animateMotion><animate attributeName="opacity" to="1" begin="0.75s" dur="0.01s" fill="freeze"/></circle>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="92" width="134" height="92" rx="12" fill="#F6F8FA" stroke="#BF8700" stroke-width="1.6"/>
    <image x="52" y="100" width="28.2" height="17" xlink:href="data:image/png;base64," href="data:image/png;base64,"/>
    <text x="107.0" y="129" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2328">AWS AI</text>
    <text x="107.0" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2328">Practitioner</text>
    <text x="107.0" y="168" text-anchor="middle" font-size="10.5" letter-spacing="0.9" fill="#8A6500">IN PROGRESS</text>
  </g>
</svg>
