  <rect width="56" height="250" fill="#FFFFFF"/>
  <text x="0" y="0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" letter-spacing="1.4" text-anchor="middle" fill="#656D76" transform="translate(22,196) rotate(-90)">TEXT VIEW</text>
  <path d="M40,148 V240 M33,231 L40,240 L47,231" fill="none" stroke="#656D76" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
