<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 400" width="1230" height="400" role="img" aria-label="AI_Journey — documenting my path into AI, one project at a time">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111926"/>
      <stop offset="55%" stop-color="#0D1420"/>
      <stop offset="100%" stop-color="#0A0F19"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8A33D"/>
      <stop offset="100%" stop-color="#D9713C"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="0" y="0" width="1230" height="400" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1230" height="400" fill="url(#ground)"/>

    <!-- faint contour rings, upper right: the terrain of a journey -->
    <g fill="none" stroke="#7C8DA6" stroke-opacity="0.10" stroke-width="1.4">
      <circle cx="1075" cy="118" r="58"/>
      <circle cx="1075" cy="118" r="104"/>
      <circle cx="1075" cy="118" r="150"/>
      <circle cx="1075" cy="118" r="196"/>
      <circle cx="1075" cy="118" r="242"/>
    </g>

    <!-- accent rule, top left -->
    <rect x="84" y="96" width="56" height="4" rx="2" fill="url(#warm)"/>

    <text x="84" y="196" fill="#F4F7FB"
          font-family="'Segoe UI Semibold','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="82" font-weight="700" letter-spacing="-2">AI_Journey</text>

    <text x="86" y="243" fill="#93A2B8"
          font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="25" letter-spacing="0.2">Documenting my path into AI — one project at a time.</text>

    <!-- the journey line: five stages, two behind me -->
    <line x1="90" y1="322" x2="1140" y2="322" stroke="#2A3647" stroke-width="2"/>
    <line x1="90" y1="322" x2="510" y2="322" stroke="url(#warm)" stroke-width="2"/>

    <circle cx="90"  cy="322" r="7" fill="#E8A33D"/>
    <circle cx="300" cy="322" r="7" fill="#E0863D"/>
    <circle cx="510" cy="322" r="9" fill="#D9713C" stroke="#0D1420" stroke-width="4"/>
    <circle cx="720" cy="322" r="5.5" fill="#0D1420" stroke="#3A4759" stroke-width="2"/>
    <circle cx="930" cy="322" r="5.5" fill="#0D1420" stroke="#3A4759" stroke-width="2"/>
    <circle cx="1140" cy="322" r="5.5" fill="#0D1420" stroke="#3A4759" stroke-width="2"/>

    <text x="84" y="360" fill="#5F6E84"
          font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="16" letter-spacing="2.6">STARTED JULY 2026 · STILL LEARNING · ALWAYS BUILDING</text>
  </g>

  <rect x="0.5" y="0.5" width="1229" height="399" rx="22" fill="none" stroke="#232E3E"/>
</svg>
