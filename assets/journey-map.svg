<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 500" width="1200" height="500" role="img"
     aria-label="My AI Journey: a chip in the centre connected to the Claude Masterclass, AWS AI Practitioner and Frameworks projects">
  <defs>
    <linearGradient id="railGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E8A33D"/>
      <stop offset="34%"  stop-color="#D9713C"/>
      <stop offset="67%"  stop-color="#8F5FBF"/>
      <stop offset="100%" stop-color="#1F6FEB"/>
    </linearGradient>
    <radialGradient id="dieGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="#F2C57C"/>
      <stop offset="45%" stop-color="#D9713C"/>
      <stop offset="100%" stop-color="#5B2E5E"/>
    </radialGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="14" fill="#0D1117"/>

  <g stroke="#1B2430" stroke-width="1" fill="none" opacity="0.85">
    <path d="M0,72 H210 L250,112 H430"/>
    <path d="M1200,72 H990 L950,112 H770"/>
    <path d="M0,470 H300 L340,430 H420"/>
    <path d="M1200,470 H900 L860,430 H780"/>
    <path d="M60,500 V360 L100,320 V250"/>
    <path d="M1140,500 V360 L1100,320 V250"/>
  </g>
  <g fill="#1B2430">
    <circle cx="250" cy="112" r="3"/><circle cx="950" cy="112" r="3"/>
    <circle cx="340" cy="430" r="3"/><circle cx="860" cy="430" r="3"/>
  </g>

  <text x="600" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="700" letter-spacing="7" fill="url(#railGrad)">MY AI JOURNEY</text>
  <rect x="480" y="68" width="240" height="3" rx="1.5" fill="url(#railGrad)" opacity="0.55"/>

  <path id="pLeft"  d="M525,230 H470 L430,180 H330" fill="none" stroke="#8F5FBF" stroke-width="2" opacity="0.55"/>
  <path id="pRight" d="M675,230 H730 L770,180 H870" fill="none" stroke="#E8A33D" stroke-width="2" opacity="0.55"/>
  <path id="pDown"  d="M600,305 V392"               fill="none" stroke="#2C3542" stroke-width="2" stroke-dasharray="6 7" opacity="0.9"/>

  <g fill="#EDE3FA" filter="url(#glow)">
    <circle r="3.4"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0s"><mpath href="#pLeft" xlink:href="#pLeft"/></animateMotion></circle>
    <circle r="3.4"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.87s"><mpath href="#pLeft" xlink:href="#pLeft"/></animateMotion></circle>
    <circle r="3.4"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.74s"><mpath href="#pLeft" xlink:href="#pLeft"/></animateMotion></circle>
  </g>
  <g fill="#FFE9C2" filter="url(#glow)">
    <circle r="3.4"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.3s"><mpath href="#pRight" xlink:href="#pRight"/></animateMotion></circle>
    <circle r="3.4"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.17s"><mpath href="#pRight" xlink:href="#pRight"/></animateMotion></circle>
    <circle r="3.4"><animateMotion dur="2.6s" repeatCount="indefinite" begin="2.04s"><mpath href="#pRight" xlink:href="#pRight"/></animateMotion></circle>
  </g>

  <g>
    <rect x="516" y="146" width="168" height="168" rx="18" fill="#0F1621" stroke="#3A4453" stroke-width="1.5"/>
    <g stroke="#4A566B" stroke-width="3" stroke-linecap="round">
      <path d="M556,146 V128"/><path d="M600,146 V122"/><path d="M644,146 V128"/>
      <path d="M556,314 V332"/><path d="M600,314 V338"/><path d="M644,314 V332"/>
      <path d="M516,186 H498"/><path d="M516,230 H492"/><path d="M516,274 H498"/>
      <path d="M684,186 H702"/><path d="M684,230 H708"/><path d="M684,274 H702"/>
    </g>
    <rect x="546" y="176" width="108" height="108" rx="10" fill="url(#dieGrad)" opacity="0.9" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.72;1;0.72" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <g stroke="#0D1117" stroke-width="1.6" opacity="0.55" fill="none">
      <path d="M546,206 H654"/><path d="M546,230 H654"/><path d="M546,254 H654"/>
      <path d="M576,176 V284"/><path d="M600,176 V284"/><path d="M624,176 V284"/>
    </g>
    <circle cx="600" cy="230" r="13" fill="#FFF3DE" filter="url(#glow)">
      <animate attributeName="r" values="11;15;11" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="137" width="290" height="86" rx="12" fill="#111A26" stroke="#8F5FBF" stroke-width="1.6"/>
    <circle cx="62" cy="159" r="4" fill="#8F5FBF" filter="url(#glow)"/>
    <text x="185" y="176" text-anchor="middle" font-size="21" font-weight="700" fill="#F0F3F8">Claude Masterclass</text>
    <text x="185" y="200" text-anchor="middle" font-size="13" letter-spacing="1.6" fill="#8F5FBF">LESSON 133 OF 158</text>

    <rect x="870" y="137" width="290" height="86" rx="12" fill="#111A26" stroke="#E8A33D" stroke-width="1.6"/>
    <circle cx="892" cy="159" r="4" fill="#E8A33D" filter="url(#glow)"/>
    <text x="1015" y="176" text-anchor="middle" font-size="21" font-weight="700" fill="#F0F3F8">AWS AI Practitioner</text>
    <text x="1015" y="200" text-anchor="middle" font-size="13" letter-spacing="1.6" fill="#E8A33D">IN PROGRESS</text>

    <rect x="455" y="392" width="290" height="76" rx="12" fill="#0F151E" stroke="#2C3542" stroke-width="1.6"/>
    <text x="600" y="425" text-anchor="middle" font-size="21" font-weight="700" fill="#6E7A8C">Frameworks</text>
    <text x="600" y="448" text-anchor="middle" font-size="13" letter-spacing="1.6" fill="#4A5566">COMING SOON</text>
  </g>
</svg>
